[project]
name = "wabtools"
version = "0.37"
description = "WhatsApp Backup Tools — archiver and viewer for WhatsApp media archives"
requires-python = ">=3.11"
dependencies = [
    "flask",
]

[project.optional-dependencies]
archiver = [
    "wa-crypt-tools",
    "iphone-backup-decrypt",
]
all = [
    "wa-crypt-tools",
    "iphone-backup-decrypt",
]

[project.scripts]
wab-archiver = "wab_archiver.__main__:main"
wab-viewer = "wab_viewer.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
