[pytest]
pythonpath = .
testpaths = tests
norecursedirs = ui
addopts = --ignore=tests/ui -m "not ui" -p no:syrupy
markers =
    unit: Fast, isolated unit tests with zero I/O
    integration: Tests verifying interaction between modules or SQLite DBs
    e2e: Multi-step archiver or viewer workflow simulations
    viewer: Tests targeting wab_viewer routes, hydration, and UI
    archiver: Tests targeting wab_archiver extraction and copy pipeline
    merger: Tests targeting protobuf decoding and delta increment replay
    preservation: Tests targeting preserved_messages.db diff engine
    shared: Tests targeting shared utility modules
    ui: Local-only headless browser UI/UX tests (requires local Edge or Chrome)
    slow: Tests running longer than 1 second
