name: Tests

on:
  push:
    paths:
      - '**.py'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - '**.py'
      - '.github/workflows/tests.yml'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest flask

      - name: Run tests
        run: pytest tests/ -v
