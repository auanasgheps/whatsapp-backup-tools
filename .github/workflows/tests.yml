name: Tests

on:
  push:
    paths:
      - '**.py'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - '**.py'
      - '.github/workflows/tests.yml'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest pytest-cov flask wa-crypt-tools iphone-backup-decrypt tzdata

      - name: Run tests
        shell: bash
        run: |
          echo "### Test Coverage Summary (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          pytest tests/ -v --cov=wab_archiver --cov=wab_viewer --cov=shared --cov-report=term-missing --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"
