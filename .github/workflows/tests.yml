name: Tests

on:
  push:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'

permissions:
  contents: write

jobs:
  lint:
    name: Lint & Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Check lint
        run: ruff check .

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest pytest-cov flask wa-crypt-tools iphone-backup-decrypt tzdata cryptography

      - name: Run tests
        shell: bash
        run: |
          echo "### Test Coverage Summary (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          pytest tests/ -v --cov=wab_archiver --cov=wab_viewer --cov=shared --cov-report=term-missing --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY" --junitxml=junit.xml

      - name: Update Test Count Badge
        if: success() && matrix.os == 'ubuntu-latest' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git clone --depth 1 --branch badges https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git .badge
          python - << 'EOF'
          import json, xml.etree.ElementTree as ET
          try:
              root = ET.parse('junit.xml').getroot()
              total = sum(int(ts.attrib.get('tests', 0)) for ts in root.iter('testsuite'))
              failures = sum(int(ts.attrib.get('failures', 0)) + int(ts.attrib.get('errors', 0)) for ts in root.iter('testsuite'))
              skipped = sum(int(ts.attrib.get('skipped', 0)) for ts in root.iter('testsuite'))
              passed = total - failures - skipped
              msg = f"{passed} passed" if failures == 0 else f"{failures} failed"
              color = "brightgreen" if failures == 0 else "red"
          except Exception:
              msg = "unknown"
              color = "lightgrey"
          data = {"schemaVersion": 1, "label": "tests", "message": msg, "color": color}
          with open(".badge/tests.json", "w") as f:
              json.dump(data, f)
          EOF
          cd .badge
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests.json
          git commit -m "chore: update test count badge [skip ci]" || exit 0
          git push origin badges
