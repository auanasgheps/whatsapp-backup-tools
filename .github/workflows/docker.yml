name: Docker Image

# Builds the image for every release tag and pushes it to
# ghcr.io/<owner>/whatsapp-backup-tools as <version> and latest.
# The test suite runs first on the image's own base, so a failing
# release never gets an image.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)build, e.g. v0.90'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  image:
    name: Build & Push
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      # latest moves only with the newest release tag, so rebuilding an
      # older release does not roll it back.
      - name: Resolve image tags
        id: meta
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:${TAG#v}"
          newest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ "$TAG" = "$newest" ]; then
            tags="$tags,$image:latest"
          fi
          {
            echo "tags=$tags"
            echo "version=${TAG#v}"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Run tests on the image base
        run: |
          base=$(awk '/^FROM/ {print $2; exit}' Dockerfile)
          docker run --rm -v "$PWD":/src:ro "$base" sh -c \
            'cp -r /src /w && cd /w && pip install -q --root-user-action=ignore ".[test]" && python -m pytest -q -p no:cacheprovider tests'

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
